name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 前端构建 : pnpm + Node , 产物进 k-spider-admin/wwwroot ( 目标由 admin 托管 )
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端构建
        run: bash scripts/build-web.sh

      # 前端 E2E : 当前为骨架冒烟用例 ( 离线确定 ) ; 业务 mock 夹具与 live 用例后续补齐
      # playwright 浏览器缓存 : 命中时跳过下载 ; 安装与跑测拆成两步 , 挂起时能直接看出卡在哪 ;
      # 不用 --with-deps ( ubuntu runner 镜像自带依赖 , apt 安装会与镜像维护进程抢锁 )
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: 安装 Playwright 浏览器
        run: pnpm --dir web exec playwright install chromium
        env:
          # 官方 CDN 在 runner 上偶发停滞且安装命令无下载超时 , 换 npmmirror 镜像
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright

      - name: 前端 E2E 测试
        run: pnpm --dir web test:e2e

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 文档链接检查
        run: bash scripts/check-docs.sh

      - name: 构建
        run: dotnet build k-spider-dotnet.sln

      # 排除 Live 分类 : 真实接口连通性用例依赖线上可达 , 不放进门禁 ( 本地手动跑 dotnet test 即可 )
      # 测试项目暂未加入 sln , 不能用 --no-build ; v1 测试替换后再调整门禁
      - name: 测试 ( 离线 )
        run: dotnet test src/k-spider-test/k-spider-test.csproj --filter "TestCategory!=Live"
