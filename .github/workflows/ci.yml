name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 与 scripts/verify.sh 同源：同一质量口径；CI 按后端 / 前端 / 文档并行。
# 唯一允许的本地差异是 verify.sh --skip-tests（本地冒烟），CI 永远跑完整测试。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  docs:
    name: 文档与技能
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 脚本零依赖（只用标准库），无需 pnpm install
      - name: 文档引用检查
        run: node scripts/check-doc-references.mjs

      - name: 文档重复检查
        run: node scripts/check-doc-duplication.mjs

      - name: 文档结构检查
        run: node scripts/check-doc-structure.mjs

      - name: 文档状态检查
        run: node scripts/check-doc-status.mjs

      - name: 技能清单检查
        run: node scripts/check-skills-manifest.mjs

  backend:
    name: 后端（构建 / 格式 / 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 版本由仓库根的 global.json 锁定，不在 workflow 里重复声明
          global-json-file: global.json

      - name: 还原
        run: dotnet restore k-spider-dotnet.sln

      - name: 构建（Release）
        run: dotnet build k-spider-dotnet.sln --configuration Release --no-restore

      - name: 格式校验
        run: dotnet format k-spider-dotnet.sln --no-restore --verify-no-changes

      # v2 守卫在解决方案内，复用上面的 Release 构建；Live 仓储用例依赖真实 PostgreSQL，默认排除。
      - name: v2 守卫测试（Release）
        run: dotnet test k-spider-dotnet.sln --configuration Release --no-build --filter "TestCategory!=Live" --logger "trx;LogFileName=v2-guards.trx"

      # 排除 Live 分类：真实接口连通性用例依赖线上可达，不放进门禁（本地手动跑 dotnet test 即可）
      # v1 测试项目暂未加入 sln，不能用 --no-build；v2 服务测试落地后替换
      - name: v1 过渡测试（Release，离线）
        run: dotnet test src/k-spider-test/k-spider-test.csproj --configuration Release --filter "TestCategory!=Live" --logger "trx;LogFileName=v1-transition.trx"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: 前端（校验 / 构建 / E2E）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端构建
        run: bash scripts/build-web.sh

      - name: 前端静态校验（lint / format / unit / bundle）
        run: pnpm --dir web run lint && pnpm --dir web run format:check && pnpm --dir web run test && pnpm --dir web run check:bundle

      - name: 前端依赖审计
        run: pnpm --dir web audit --audit-level high --registry https://registry.npmjs.org/

      # playwright 浏览器缓存：命中时跳过下载；安装与跑测拆成两步，挂起时能直接看出卡在哪；
      # 不用 --with-deps（ubuntu runner 镜像自带依赖，apt 安装会与镜像维护进程抢锁）
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: 安装 Playwright 浏览器
        run: pnpm --dir web exec playwright install chromium
        env:
          # 官方 CDN 在 runner 上偶发停滞且安装命令无下载超时，换 npmmirror 镜像
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright

      - name: 前端 E2E 测试
        run: pnpm --dir web test:e2e
