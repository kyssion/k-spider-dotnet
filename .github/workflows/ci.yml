name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 前端构建 : pnpm + Node , 产物进 k-spider-web/wwwroot ( 后续 dotnet build 打包 )
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端构建
        run: bash scripts/build-web.sh

      # E2E : mock API 夹具驱动 ( 离线确定 ) ; live 用例默认跳过 , 与后端 Live 分类同款分层
      - name: 前端 E2E 测试
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          pnpm --dir web test:e2e

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 文档链接检查
        run: bash scripts/check-docs.sh

      - name: 构建
        run: dotnet build k-spider-dotnet.sln

      # 排除 Live 分类 : 真实接口连通性用例依赖线上可达 , 不放进门禁 ( 本地手动跑 dotnet test 即可 )
      - name: 测试 ( 离线 )
        run: dotnet test src/k-spider-test/k-spider-test.csproj --no-build --filter "TestCategory!=Live"
